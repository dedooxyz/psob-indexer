[workspace]
members = [
    ".",
    "crates/common",
    "crates/chain-rpc"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[package]
name = "psob-indexer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
common = { path = "crates/common" }
chain-rpc = { path = "crates/chain-rpc" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
sha2 = "0.10"
anyhow = "1.0"
tokio = { version = "1.37", features = ["full"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.5", features = ["cors", "trace", "catch-panic"] }
dotenvy = "0.15"
toml = "0.8"
uuid = { version = "1.8", features = ["v4"] }
fastrand = "2"
libp2p = { version = "0.54", features = ["macros", "tokio", "gossipsub", "mdns", "noise", "yamux", "tcp", "identify", "ping"] }
redb = "2.1"
dashmap = "6.1"
bincode = "1.3"
utoipa = { version = "4", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "5", features = ["axum"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_urlencoded = "0.7"

[workspace.dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
anyhow = "1.0"
tokio = { version = "1.37", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fastrand = "2"
scrypt = "0.11"
