# psob-indexer — single-service stack with Prometheus support.
#
#   cp .env.example .env       # or copy the chains you care about below
#   docker compose up -d
#   curl http://localhost:8080/api/v1/health
#   curl http://localhost:8080/metrics        # Prometheus exposition
#   curl http://localhost:8080/docs           # Swagger UI

services:
  indexer:
    build: .
    image: psob-indexer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"   # REST API
      - "9000:9000"   # libp2p gossip (TCP)
    environment:
      # ── required chain registry (see .env.example for the format) ──────────
      PSOB_CHAINS: ${PSOB_CHAINS:-JKC|8224|https://junk-api.s3na.xyz|0x1e0fffff|1095300,DINGO|50|https://dingo-api.s3na.xyz|0x1e0fffff|2717300,LKY|8211|https://lky-api.s3na.xyz|0x1e0fffff|1062050,SHIC|74|https://shic-api.s3na.xyz|0x1e0fffff|835600,TRMP|168|https://trmp-api.s3na.xyz|0x1e0fffff|539900,CRC|8228|https://crc-api.s3na.xyz|0x1e0fffff|1049900,B1T|2840|https://bit-api.s3na.xyz|0x1e0fffff|525650,LBW|8256|https://lbw-api.s3na.xyz|0x1e0fffff|771400}
      PSOB_DB_PATH: /data/psob-indexer.redb
      PSOB_CCNODES_BASE: ${PSOB_CCNODES_BASE:-https://litecoinspace.org/api}
      PSOB_START_HEIGHT: ${PSOB_START_HEIGHT:-1000000}
      # Bounded-window policy (optional): keep only the last N blocks per chain.
      PSOB_MAX_KEPT_BLOCKS: ${PSOB_MAX_KEPT_BLOCKS:-}
    volumes:
      - psob-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional: scrape metrics. Uncomment and `docker compose up -d prometheus`.
  # prometheus:
  #   image: prom/prometheus:latest
  #   restart: unless-stopped
  #   command:
  #     - --config.file=/etc/prometheus/prometheus.yml
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #   ports:
  #     - "9090:9090"

volumes:
  psob-data:
