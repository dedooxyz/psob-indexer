[package]
name = "common"
version.workspace = true
edition.workspace = true
license.workspace = true

# Shared types for the guest, host prover, and contract calldata encoding.
# Kept dependency-light so it compiles cleanly for the zkVM (riscv32im) target.
[features]
default = ["std"]
std = ["serde/std", "hex/std"]

[dependencies]
serde = { workspace = true, default-features = false, features = ["derive", "alloc"] }
hex = { workspace = true, default-features = false, features = ["alloc"] }
# sha256d for AuxPoW (merged-mining) commitment verification. no_std for the guest.
sha2 = { workspace = true, default-features = false }
