# psob-indexer — optional TOML configuration.
#
# This file is ONLY used when it exists at ./psob-indexer.toml (or when
# PSOB_CONFIG points at it). Environment variables override every value here —
# e.g. PSOB_CHAINS beats [[chains]].

# ─── Aux chains to ingest ──────────────────────────────────────────────────────
# Adding a chain is a new [[chains]] block — no code changes. Dogecoin/Bellcoin
# are AuxPoW-mined BY Litecoin and go here like any other aux chain:
#   chain_id = nVersion >> 16 (look it up in that chain's core), an Esplora URL
#   serving raw CAuxPow headers, pow_limit_bits 0x1e0fffff.
[[chains]]
name = "JKC"
chain_id = 8224
electrs_url = "https://junk-api.s3na.xyz"
pow_limit_bits = "0x1e0fffff"   # hex, 0x prefix optional
start_height = 1095300           # optional: cursor seed for fresh DBs

[[chains]]
name = "DINGO"
chain_id = 50
electrs_url = "https://dingo-api.s3na.xyz"
pow_limit_bits = "0x1e0fffff"

# ─── Registry-only chains (registered, NEVER ingested) ────────────────────────
# Upserted into the chain registry at startup (swap validation + /api/v1/chains
# with "ingested": false); no ingest task polls them. A chain_id may not appear
# in both [[chains]] and [[known_chains]] — startup rejects that.
# Litecoin is the PARENT chain (see [resolver]): its 80-byte headers carry no
# AuxPoW witness, but swaps settle against it, so it must be known.
[[known_chains]]
name = "LTC"
chain_id = 8192
electrs_url = "https://ltc-api.s3na.xyz"

# ─── Storage ───────────────────────────────────────────────────────────────────
db_path = "psob-indexer.redb"

# ─── Parent-chain resolver ─────────────────────────────────────────────────────
[resolver]
base = "https://litecoinspace.org/api"
api_key = ""
# Parent chain slug — validated at startup (lowercased; must be "litecoin" or
# "bitcoin"). A typo silently mis-classifies parents as "trial", so it fails
# loudly instead of failing quiet.
parent_chain = "litecoin"
# fallback_base = "https://another-explorer.example/api"

# ─── Tuning ────────────────────────────────────────────────────────────────────
max_batch = 64
poll_interval_secs = 15
# start_height = 1000000
# Bounded-window mode: keep only the most recent N blocks per chain.
# max_kept_blocks = 500000

[retry]
max_retries = 5
base_backoff_ms = 500
max_backoff_ms = 30000
min_request_interval_ms = 0

[http]
timeout_secs = 30
concurrency = 8

